# Labels for the selection comparison. Written 2026-11-02, before any translator or selector ran.
# Author-written, so subjective; the reasons are given where a label could be argued.
#
# terms: glossary term IDs whose concept the artefacts refer to, asserted or negated
#        (translator accuracy is about recognising the concept, not judging compliance).
# units: units (by folder name) whose rule is relevant to the feature, judged independently of terms.
#        hard-rule-4-copy is always loaded (bright line) and is left out of selection scoring.
# Paths are relative to spikes/rule-units/.
fixtures:
