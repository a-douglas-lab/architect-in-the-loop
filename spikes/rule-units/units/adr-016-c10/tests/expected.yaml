# Expected results, written 2026-11-02 before the check existed. Never edited after a run;
# a wrong expectation gets a new dated entry. Paths are relative to spikes/rule-units/.
# expect: finding | none. todo: true marks a case the check is predicted to get wrong
# (after Semgrep's todoruleid); it is reported, and doesn't fail the run.
unit: ADR-016@v1 C10
cases:
  - {name: f8 names CSV, stage: analyze, artefacts: ../../tests/constitution/fixtures/f8-subtle-breach, expect: finding}
  - {name: paraphrase names a spreadsheet, stage: analyze, artefacts: fixtures/n1-violations-paraphrased, expect: finding}
  - {name: SARIF named, stage: analyze, artefacts: fixtures/c10-sarif-output, expect: none}
  - {name: no violation report at all, stage: analyze, artefacts: ../../tests/constitution/fixtures/f1-compliant, expect: none}
  - {name: format described but not named, stage: analyze, artefacts: fixtures/c10-unnamed-format, expect: finding, todo: true}
  - {name: SARIF file, stage: implement, file: units/adr-016-c10/tests/files/findings.sarif, expect: none, version: "2.1.0"}
  - {name: CSV file, stage: implement, file: units/adr-016-c10/tests/files/findings.csv, expect: finding}
  - {name: JSON that isn't SARIF, stage: implement, file: units/adr-016-c10/tests/files/plain.json, expect: finding}
# Added 2026-11-03, before the check changed: ADR-016 v2 adds C17, pinning SARIF 2.1.0
# (Andy, 3 Nov: "yes, do both."). A SARIF file at another version is a finding under C17.
# The 2.1.0 case above still expects none. `rule` names the citation a finding must carry
# when it differs from the unit's.
  - {name: SARIF 1.0.0 file (Roslyn's default), stage: implement, file: units/adr-016-c10/tests/files/findings-v1.sarif, expect: finding, rule: ADR-016@v2 C17}
  - {name: SARIF 2.2 draft file, stage: implement, file: units/adr-016-c10/tests/files/findings-v2.2.sarif, expect: finding, rule: ADR-016@v2 C17}
