# Expected results, written 2026-11-03 before the check existed. Never edited after a run;
# a wrong expectation gets a new dated entry. Paths are relative to spikes/rule-units/.
# expect: finding | none. todo: true marks a case the check is predicted to get wrong.
unit: ADR-016@v2 C17
cases:
  - {name: SARIF named without a version, stage: analyze, artefacts: fixtures/c10-sarif-output, expect: none}
  - {name: plan names SARIF 1.0, stage: analyze, artefacts: fixtures/c17-sarif-old-version, expect: finding}
  - {name: plan names SARIF v2.1, stage: analyze, artefacts: fixtures/c17-sarif-short-version, expect: none}
  - {name: no SARIF at all (f8 names CSV), stage: analyze, artefacts: ../../tests/constitution/fixtures/f8-subtle-breach, expect: none}
  - {name: plan names a SARIF version in words, stage: analyze, artefacts: fixtures/c17-sarif-version-in-words, expect: finding, todo: true}
  - {name: SARIF 2.1.0 file, stage: implement, file: units/adr-016-c10/tests/files/findings.sarif, expect: none, version: "2.1.0"}
  - {name: SARIF 1.0.0 file (Roslyn's default), stage: implement, file: units/adr-016-c10/tests/files/findings-v1.sarif, expect: finding, version: "1.0.0"}
  - {name: SARIF 2.2 draft file, stage: implement, file: units/adr-016-c10/tests/files/findings-v2.2.sarif, expect: finding, version: "2.2"}
  - {name: JSON that isn't SARIF (C10's job), stage: implement, file: units/adr-016-c10/tests/files/plain.json, expect: none}
