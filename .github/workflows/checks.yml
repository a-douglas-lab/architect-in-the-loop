# The checks every pull request must pass (backlog Q6, VL-6). Andy requires the job named
# `checks` in the main ruleset; it fails if any job it needs fails, so suites can be added
# here without editing the ruleset (Andy, 4 Nov). Runs only deterministic, offline checks:
# the live claude -p cases and tests/constitution/ need a model and stay out.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Andy, 4 Nov: both must pass
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Private-material guard on this tree (ADR-011@v2 C7)
        shell: bash
        run: bash scripts/check-private-material.sh "$GITHUB_WORKSPACE"
      - name: Guard tests, bash
        shell: bash
        run: bash tests/controls/test-private-material.sh
      - name: Guard tests, Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/controls/test-private-material.ps1
          exit $LASTEXITCODE
      - name: Hook tests (ADR-011@v2 C1, C3)
        run: python -I tests/controls/test_hooks.py
      - name: Trailer-check tests (ADR-010@v1 C5)
        run: python -I tests/ci/test_trailers.py
      - name: Rule-unit spike tests
        working-directory: spikes/rule-units
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pytest -q

  trailers:
    name: trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: AI-authored commits carry the trailer (ADR-010@v1 C5)
        env:   # through env, not inline, so a branch name can't inject shell
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: python3 -I scripts/check-trailers.py "$BASE" "$HEAD" "$BRANCH"

  checks:
    name: checks
    if: always()
    needs: [suites, trailers]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended: $r"; exit 1 ;; esac
          done
